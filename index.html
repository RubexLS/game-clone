<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/components.css">
</head>
<body>
    <div id="lobby-screen">
        <div class="lobby-box">
            <h1>Monopoly Online</h1>
            <div class="input-group">
                <label for="lobby-username">Tu Nombre:</label>
                <input type="text" id="lobby-username" placeholder="Ej. Carlos" maxlength="12">
            </div>
            <div class="input-group">
                <label for="lobby-color">Color de Ficha:</label>
                <select id="lobby-color">
                    <option value="#e74c3c">Rojo</option>
                    <option value="#3498db">Azul</option>
                    <option value="#2ecc71">Verde</option>
                    <option value="#f1c40f">Amarillo</option>
                    <option value="#9b59b6">Morado</option>
                </select>
            </div>
            <div class="input-group">
                <label for="lobby-room">Código de Sala:</label>
                <input type="text" id="lobby-room" placeholder="Ej. SALA123" uppercase>
            </div>
            <div class="lobby-buttons">
                <button id="btn-create-room">Crear Nueva Sala</button>
                <button id="btn-join-room">Unirse a Sala</button>
            </div>
        </div>
    </div>

    <div id="game-container">
        <!-- Panel Lateral Izquierdo: Información de Jugadores -->
        <aside id="players-panel">
            <h2>Jugadores</h2>
            <div id="players-list">
                <!-- Se llenará dinámicamente con JS -->
            </div>
            <div id="game-controls">
                <button id="btn-roll-dice" disabled>Lanzar Dados</button>
                <button id="btn-end-turn" disabled>Terminar Turno</button>
            </div>
            <div id="game-log">
                <h3>Historial</h3>
                <div id="log-messages"></div>
            </div>
        </aside>

        <!-- Tablero -->
        <main id="board">
            <!-- Centro del tablero (Grid Row 2 a 10, Col 2 a 10) -->
            <div class="board-center">
                <h1>MONOPOLY</h1>
                <div id="dice-view">🎲 🎲</div>
                <div id="current-turn-info">Esperando jugadores...</div>
            </div>

            <!-- Las 40 casillas se generarán dinámicamente con JavaScript -->
            <!-- divs con clase .square del 0 al 39 -->
        </main>

        <!-- Ventana Flotante de Compra (Oculta por defecto) -->
        <div id="buy-property-modal" class="hidden">
            <div class="modal-content">
                <h3 id="modal-property-name">Propiedad Disponible</h3>
                <p id="modal-property-price">Precio: $0</p>
                <div class="modal-buttons">
                    <button id="btn-confirm-buy">Comprar</button>
                    <button id="btn-decline-buy">Pasar</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts Modulares -->
    <script type="module" src="js/app.js"></script>
</body>
</html>
